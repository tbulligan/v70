<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voldemaras VII: Septyni dešimtmečiai legendos (Voldemarui – 70!)</title>
  <meta name="description" content="Šventinė interaktyvi fotoprezentacija Voldemaro 70-mečio jubiliejaus proga su archyvinėmis nuotraukomis ir šmaikščiais komentarais.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="bg-ambient"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <main class="presentation-container">
    <!-- Top Progress Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Active Slide Viewport -->
    <section class="slide-viewport" id="slideViewport" aria-live="polite">
      <!-- Slides dynamically generated by app.js from slides_data.js -->
    </section>

    <!-- Floating Navigation Bar -->
    <nav class="bottom-nav" aria-label="Prezentacijos valdymas">
      <button class="nav-btn" id="btnPrev" title="Ankstesnė skaidrė (PageUp)" aria-label="Ankstesnė skaidrė">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="slide-counter">
        <span class="counter-current" id="counterCurrent">01</span>
        <span>/</span>
        <span id="counterTotal">17</span>
      </div>

      <button class="nav-btn primary" id="btnNext" title="Kita skaidrė (PageDown)" aria-label="Kita skaidrė">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <div class="nav-divider"></div>

      <button class="nav-btn" id="btnDrawer" title="Visų skaidrių sąrašas" aria-label="Skaidrių sąrašas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </button>

      <button class="nav-btn" id="btnFullscreen" title="Visas ekranas (F)" aria-label="Visas ekranas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </nav>

    <!-- Bottom Keyboard Shortcut Hint -->
    <div class="keyboard-hint" aria-hidden="true">
      <span class="kbd">←</span> <span class="kbd">→</span> / <span class="kbd">Tarpas</span> Nuosekli eiga
      <span class="kbd">F</span> Visas ekranas
      <span class="kbd">Esc</span> Uždaryti
    </div>
  </main>

  <!-- Seamless Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal" role="dialog" aria-modal="true" aria-label="Nuotraukos didinimas">
    <button class="lightbox-close-btn" id="lightboxClose" title="Grįžti į skaidrę (Esc)" aria-label="Uždaryti">&times;</button>
    
    <button class="lightbox-nav-btn lb-prev" id="lbPrev" title="Ankstesnė nuotrauka (←)" aria-label="Ankstesnė nuotrauka">‹</button>
    <button class="lightbox-nav-btn lb-next" id="lbNext" title="Kita nuotrauka (→ / Tarpas)" aria-label="Kita nuotrauka">›</button>

    <div class="lightbox-content">
      <div class="lightbox-counter" id="lbCounter">1 / 1</div>
      <div class="lightbox-img-wrap">
        <img class="lightbox-img" id="lightboxImg" src="" alt="Padidinta nuotrauka" />
      </div>
      <div class="lightbox-info">
        <h3 class="lightbox-title" id="lightboxTitle"></h3>
        <p class="lightbox-caption" id="lightboxCaption"></p>
      </div>
    </div>
  </div>

  <!-- Slides Overview Drawer Modal -->
  <div class="drawer-modal" id="drawerModal" role="dialog" aria-modal="true" aria-label="Skaidrių apžvalga">
    <div class="drawer-header">
      <h2 class="drawer-title">Prezentacijos skaidrės</h2>
      <button class="drawer-close-btn" id="drawerClose" title="Uždaryti" aria-label="Uždaryti">&times;</button>
    </div>
    <div class="drawer-grid" id="drawerGrid">
      <!-- Populated dynamically by app.js -->
    </div>
  </div>

  <script src="slides_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
